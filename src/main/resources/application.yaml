spring:
  application:
    name: crm
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB}?prepareThreshold=0
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      data-source-properties:
        prepareThreshold: 0
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        default_batch_fetch_size: 50
  threads:
    virtual:
      enabled: true
app:
  jwt:
    secret: ${JWT_SECRET}
    expiracao-segundos: ${JWT_EXPIRACAO_SEGUNDOS}
  admin:
    nome: ${ADMIN_NOME}
    email: ${ADMIN_EMAIL}
    senha: ${ADMIN_SENHA}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    login-capacidade: ${RATE_LIMIT_LOGIN_CAPACIDADE:10}
    login-janela-segundos: ${RATE_LIMIT_LOGIN_JANELA_SEGUNDOS:60}
    api-capacidade: ${RATE_LIMIT_API_CAPACIDADE:100}
    api-janela-segundos: ${RATE_LIMIT_API_JANELA_SEGUNDOS:60}