spring:
  application:
    name: crm
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB}?prepareThreshold=0
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      data-source-properties:
        prepareThreshold: 0
  jpa:
    hibernate:
      ddl-auto: update
app:
  jwt:
    secret: ${JWT_SECRET}
    expiracao-segundos: ${JWT_EXPIRACAO_SEGUNDOS}
  admin:
    nome: ${ADMIN_NOME}
    email: ${ADMIN_EMAIL}
    senha: ${ADMIN_SENHA}