spring:
  application:
    name: crm
  datasource:
    url: jdbc:postgresql://127.0.0.1:5432/db_crm
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

app:
  jwt:
    secret: ${JWT_SECRET:chave-secreta-padrao-com-no-minimo-32-caracteres-para-hs256}
    expiracao-segundos: ${JWT_EXPIRACAO_SEGUNDOS:28800}
  admin:
    nome: ${ADMIN_NOME:Administrador}
    email: ${ADMIN_EMAIL:admin@crm.com}
    senha: ${ADMIN_SENHA:admin123}